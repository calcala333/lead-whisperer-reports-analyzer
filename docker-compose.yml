services:
  web:
    build: .
    image: active-orders-of-protection:latest
    container_name: aop-web
    restart: unless-stopped
    ports:
      - "6900:6900"
    environment:
      - PORT=6900
      - DATA_DIR=/data
      - UPLOAD_DIR=/data/uploads
      - DB_FILE=/data/db.json
    volumes:
      # Persist uploaded documents AND the JSON data store on the host.
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6900/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
