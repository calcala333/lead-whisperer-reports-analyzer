services:
  web:
    build: .
    image: active-orders-of-protection:latest
    container_name: aop-web
    restart: unless-stopped
    ports:
      - "6900:6900"
    environment:
      - PORT=6900
      - UPLOAD_DIR=/data/uploads
    volumes:
      # Persist uploaded documents on the host.
      - ./uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6900/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
